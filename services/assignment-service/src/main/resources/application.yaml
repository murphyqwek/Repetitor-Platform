spring:
  application:
    name: assignment-service
  datasource:
    url: ${ASSIGNMENT_DB_URL}
    username: ${ASSIGNMENT_DB_USER}
    password: ${ASSIGNMENT_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${ASSIGNMENT_DB_POOL_SIZE:10}
      connection-timeout: 5000
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    clean-disabled: true
  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 22MB
  lifecycle:
    timeout-per-shutdown-phase: 20s
server:
  port: ${ASSIGNMENT_PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          # Kafka is intentionally outside readiness because events will be buffered in the outbox.
          include: readinessState,db,objectStorage
assignment:
  kafka:
    bootstrap-servers: ${ASSIGNMENT_KAFKA_BOOTSTRAP_SERVERS}
  storage:
    endpoint: ${ASSIGNMENT_S3_ENDPOINT:}
    bucket: ${ASSIGNMENT_S3_BUCKET:}
    access-key: ${ASSIGNMENT_S3_ACCESS_KEY:}
    secret-key: ${ASSIGNMENT_S3_SECRET_KEY:}
