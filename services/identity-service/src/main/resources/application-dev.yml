spring:
  application:
    name: identity-service

  datasource:
    url: ${IDENTITY_DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      connect-timeout: 2s
      lettuce:
        shutdown-timeout: 2s

identity:
  cleanup:
    expired-codes:
      cron: "0 0 3 * * *"
      zone: Europe/Minsk
  security:
    cookies:
      secure: false
    refreshTtl: 7d
    jwt:
      public-key-path: ${JWT_PUBLIC_KEY_PATH}
      issuer: ${JWT_ISSUER:rp-identity}
      private-key-path: ${JWT_PRIVATE_KEY_PATH}
      ttl: 15m

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
