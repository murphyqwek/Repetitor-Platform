spring:
  application:
    name: education-service
  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${EDUCATION_DB_URL}
    username: ${EDUCATION_DB_USER}
    password: ${EDUCATION_DB_PASSWORD}
    hikari:
      connection-timeout: 5000
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-file-size: ${EDUCATION_MULTIPART_MAX_FILE_SIZE:250MB}
      max-request-size: ${EDUCATION_MULTIPART_MAX_REQUEST_SIZE:252MB}
server:
  port: ${EDUCATION_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,objectStorage
education:
  outbox:
    enabled: ${EDUCATION_OUTBOX_ENABLED:true}
    bootstrap-servers: ${EDUCATION_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    topic: ${EDUCATION_SCHEDULE_TOPIC:education.schedule.v1}
    batch-size: 20
    send-timeout-ms: 5000
    poll-delay-ms: 1000
  security:
    issuer: ${EDUCATION_JWT_ISSUER:rp-identity}
    public-key-location: ${EDUCATION_JWT_PUBLIC_KEY_LOCATION}
  identity:
    base-url: ${EDUCATION_IDENTITY_BASE_URL}
    connect-timeout: 2s
    read-timeout: 3s
  cursor:
    key: ${EDUCATION_CURSOR_KEY:}
  storage:
    endpoint: ${EDUCATION_S3_ENDPOINT:}
    bucket: ${EDUCATION_S3_BUCKET:}
    access-key: ${EDUCATION_S3_ACCESS_KEY:}
    secret-key: ${EDUCATION_S3_SECRET_KEY:}
