spring:
  datasource:
    url: ${EDUCATION_DB_URL:jdbc:postgresql://localhost:5433/education}
server:
  port: ${EDUCATION_PORT:8081}
education:
  security:
    public-key-location: ${EDUCATION_JWT_PUBLIC_KEY_LOCATION:file:../../dev_secrets/jwt_public.pem}
  identity:
    base-url: ${EDUCATION_IDENTITY_BASE_URL:http://localhost:8080}
  storage:
    endpoint: ${EDUCATION_S3_ENDPOINT:http://localhost:9000}
    bucket: ${EDUCATION_S3_BUCKET:education-private}
