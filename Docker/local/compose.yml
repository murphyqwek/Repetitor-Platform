
name: tutor-platform-local

services:
  nginx:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:80"
    depends_on:
      frontend:
        condition: service_healthy
        restart: true

  frontend:
    build:
      context: ../..
      target: web-app
    restart: unless-stopped
    environment:
      EDUCATION_API_URL: http://education:8080
    depends_on:
      identity:
        condition: service_healthy
      education:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tutor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tutor_platform}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10

  identity:
    build:
      context: ../..
      target: java-app
      args:
        SERVICE: identity-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: dev
      IDENTITY_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-tutor_platform}
      POSTGRES_USER: ${POSTGRES_USER:-tutor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      JWT_ISSUER: ${JWT_ISSUER:-rp-identity}
      JWT_PRIVATE_KEY_PATH: /run/keys/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /run/keys/jwt_public.pem
      STUDENT_CREDENTIALS_KEY: ${STUDENT_CREDENTIALS_KEY:?set STUDENT_CREDENTIALS_KEY in .env}
      ASSIGNMENT_IDENTITY_SIGNING_KEY: ${ASSIGNMENT_IDENTITY_SIGNING_KEY:?set ASSIGNMENT_IDENTITY_SIGNING_KEY in .env}
    volumes:
      - ../../.local-docker/jwt_private.pem:/run/keys/jwt_private.pem:ro
      - ../../.local-docker/jwt_public.pem:/run/keys/jwt_public.pem:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 6s
      start_period: 40s
      retries: 12

  education-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: education
      POSTGRES_USER: ${EDUCATION_DB_USER:?set EDUCATION_DB_USER in .env}
      POSTGRES_PASSWORD: ${EDUCATION_DB_PASSWORD:?set EDUCATION_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${EDUCATION_DB_HOST_PORT:-5433}:5432"
    volumes:
      - education_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d education"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # Explicit local Silo fork decision: docs/артефакты/education-service/ADR-001-local-object-storage.md.
    image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z@sha256:c20d112390b9a9ce8c11b8af95ad35bcaa62f4759663c09c936cd8d2b511f329
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - education_minio_data:/data
    healthcheck:
      test: ["CMD", "/usr/bin/silo", "healthcheck", "ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: pgsty/mc:RELEASE.2026-11-12T00-00-00Z@sha256:b532278b7a3747dbab6fe45eebb40a653efa704e6758e24e9d9ec54fc96c1800
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      EDUCATION_S3_BUCKET: ${EDUCATION_S3_BUCKET:-education-private}
      EDUCATION_S3_ACCESS_KEY: ${EDUCATION_S3_ACCESS_KEY:?set EDUCATION_S3_ACCESS_KEY in .env}
      EDUCATION_S3_SECRET_KEY: ${EDUCATION_S3_SECRET_KEY:?set EDUCATION_S3_SECRET_KEY in .env}
    volumes:
      - ./minio/bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    restart: "no"

  education:
    build:
      context: ../..
      target: java-app
      args:
        SERVICE: education-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local
      EDUCATION_PORT: 8080
      EDUCATION_JWT_PUBLIC_KEY_LOCATION: file:/run/keys/identity-public.pem
      EDUCATION_JWT_ISSUER: ${JWT_ISSUER:-rp-identity}
      EDUCATION_IDENTITY_BASE_URL: http://identity:8080
      EDUCATION_CURSOR_KEY: ${EDUCATION_CURSOR_KEY:?set EDUCATION_CURSOR_KEY in .env}
      ASSIGNMENT_EDUCATION_SIGNING_KEY: ${ASSIGNMENT_EDUCATION_SIGNING_KEY:?set ASSIGNMENT_EDUCATION_SIGNING_KEY in .env}
      EDUCATION_ASSIGNMENT_TOKEN: ${EDUCATION_ASSIGNMENT_TOKEN:-}
      EDUCATION_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EDUCATION_SCHEDULE_TOPIC: ${EDUCATION_SCHEDULE_TOPIC:-education.schedule.v1}
      EDUCATION_OUTBOX_ENABLED: "true"
      EDUCATION_DB_URL: jdbc:postgresql://education-postgres:5432/education
      EDUCATION_DB_USER: ${EDUCATION_DB_USER:?set EDUCATION_DB_USER in .env}
      EDUCATION_DB_PASSWORD: ${EDUCATION_DB_PASSWORD:?set EDUCATION_DB_PASSWORD in .env}
      EDUCATION_S3_ENDPOINT: http://minio:9000
      EDUCATION_S3_BUCKET: ${EDUCATION_S3_BUCKET:-education-private}
      EDUCATION_S3_ACCESS_KEY: ${EDUCATION_S3_ACCESS_KEY:?set EDUCATION_S3_ACCESS_KEY in .env}
      EDUCATION_S3_SECRET_KEY: ${EDUCATION_S3_SECRET_KEY:?set EDUCATION_S3_SECRET_KEY in .env}
    volumes:
      - ../../.local-docker/jwt_public.pem:/run/keys/identity-public.pem:ro
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      identity:
        condition: service_healthy
      education-postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 6s
      start_period: 40s
      retries: 6

  assignment-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: assignment
      POSTGRES_USER: ${ASSIGNMENT_DB_USER:-assignment}
      POSTGRES_PASSWORD: ${ASSIGNMENT_DB_PASSWORD:?set ASSIGNMENT_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${ASSIGNMENT_DB_HOST_PORT:-5434}:5432"
    volumes:
      - assignment_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d assignment"]
      interval: 5s
      timeout: 3s
      retries: 20

  assignment-minio-init:
    image: pgsty/mc:RELEASE.2026-11-12T00-00-00Z@sha256:b532278b7a3747dbab6fe45eebb40a653efa704e6758e24e9d9ec54fc96c1800
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      EDUCATION_S3_BUCKET: ${EDUCATION_S3_BUCKET:-education-private}
      EDUCATION_S3_ACCESS_KEY: ${EDUCATION_S3_ACCESS_KEY:?set EDUCATION_S3_ACCESS_KEY in .env}
      ASSIGNMENT_S3_BUCKET: ${ASSIGNMENT_S3_BUCKET:-assignment-private}
      ASSIGNMENT_S3_ACCESS_KEY: ${ASSIGNMENT_S3_ACCESS_KEY:?set ASSIGNMENT_S3_ACCESS_KEY in .env}
      ASSIGNMENT_S3_SECRET_KEY: ${ASSIGNMENT_S3_SECRET_KEY:?set ASSIGNMENT_S3_SECRET_KEY in .env}
    volumes:
      - ./minio/bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap.sh", "assignment"]
    restart: "no"

  assignment:
    build:
      context: ../..
      target: java-app
      args:
        SERVICE: assignment-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local
      ASSIGNMENT_JWT_PUBLIC_KEY_LOCATION: file:/run/keys/identity-public.pem
      JWT_ISSUER: ${JWT_ISSUER:-rp-identity}
      ASSIGNMENT_IDENTITY_URL: http://identity:8080
      ASSIGNMENT_EDUCATION_URL: http://education:8080
      ASSIGNMENT_IDENTITY_SIGNING_KEY: ${ASSIGNMENT_IDENTITY_SIGNING_KEY:?set ASSIGNMENT_IDENTITY_SIGNING_KEY in .env}
      ASSIGNMENT_EDUCATION_SIGNING_KEY: ${ASSIGNMENT_EDUCATION_SIGNING_KEY:?set ASSIGNMENT_EDUCATION_SIGNING_KEY in .env}
      ASSIGNMENT_CURSOR_KEY: ${ASSIGNMENT_CURSOR_KEY:?set ASSIGNMENT_CURSOR_KEY in .env}
      ASSIGNMENT_PORT: 8080
      ASSIGNMENT_DB_URL: jdbc:postgresql://assignment-postgres:5432/assignment
      ASSIGNMENT_DB_USER: ${ASSIGNMENT_DB_USER:-assignment}
      ASSIGNMENT_DB_PASSWORD: ${ASSIGNMENT_DB_PASSWORD:?set ASSIGNMENT_DB_PASSWORD in .env}
      ASSIGNMENT_S3_ENDPOINT: http://minio:9000
      ASSIGNMENT_S3_BUCKET: ${ASSIGNMENT_S3_BUCKET:-assignment-private}
      ASSIGNMENT_S3_ACCESS_KEY: ${ASSIGNMENT_S3_ACCESS_KEY:?set ASSIGNMENT_S3_ACCESS_KEY in .env}
      ASSIGNMENT_S3_SECRET_KEY: ${ASSIGNMENT_S3_SECRET_KEY:?set ASSIGNMENT_S3_SECRET_KEY in .env}
      ASSIGNMENT_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - ../../.local-docker/jwt_public.pem:/run/keys/identity-public.pem:ro
    ports:
      - "127.0.0.1:${ASSIGNMENT_PORT:-8082}:8080"
    depends_on:
      education:
        condition: service_healthy
      assignment-postgres:
        condition: service_healthy
      assignment-minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 6s
      start_period: 40s
      retries: 6

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.1.1
    hostname: kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: >-
        INTERNAL://0.0.0.0:29092,
        EXTERNAL://0.0.0.0:9092,
        CONTROLLER://0.0.0.0:9093

      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://kafka:29092,
        EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        INTERNAL:PLAINTEXT,
        EXTERNAL:PLAINTEXT,
        CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka_data:/var/lib/kafka/data

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  education_postgres_data:
  education_minio_data:
  assignment_postgres_data:
